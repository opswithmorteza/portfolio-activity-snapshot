name: Daily portfolio refresh

on:
  schedule:
    # 00:47 Asia/Tehran (UTC+03:30); offset avoids the busiest cron minute.
    - cron: '17 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build verified public snapshot
        run: python refresh.py
      - name: Commit current status when data is available
        run: |
          git config user.name "Morteza Rajabi"
          git config user.email "Mortezarajabim1400@gmail.com"
          git add public history DAILY_STATUS.md
          git diff --cached --quiet || git commit -m "chore(activity): refresh daily public snapshot"
          git push
